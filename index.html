<style>
:root{color-scheme:light dark;--bg:#F2F3F5;--ink:#23272B;--muted:#6B7280;--line:#DADDE2;--accent:#2F7F63;--surface:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#16181B;--ink:#E7E9EC;--muted:#9AA3AD;--line:#33383E;--accent:#7CC8A6;--surface:#1E2124}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"Hiragino Sans",system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 20px;display:grid;gap:12px}
h1{font-size:1rem;margin:0;font-weight:600;letter-spacing:.02em}
input{font:inherit;font-family:ui-monospace,Menlo,monospace;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);width:100%}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;padding:10px;border:0;border-radius:4px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
label.r{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.err{font-size:.85rem;color:#A6432C;min-height:1.2em;margin:0}
</style></head><body>

  <p class="err" id="e"></p>
</form>
